<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보도자료 HWPX 만들기</title>
<style>
  :root{--bg:#f6f4ef;--card:#fff;--ink:#222;--muted:#666;--line:#ddd6c8;--accent:#1f7a6b;--warn:#a8481c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.6}
  header{padding:20px 24px 8px} h1{margin:0;font-size:24px} .sub{color:var(--muted);font-size:14px}
  main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:8px 24px 40px;max-width:1300px}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
  label{display:block;font-size:13px;color:var(--muted);margin-top:10px}
  input,textarea{width:100%;font:inherit;font-size:14px;padding:6px 8px;border:1px solid #ccc;border-radius:6px}
  textarea{resize:vertical}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:10px 16px;font-size:15px;cursor:pointer;margin-top:14px}
  button.light{background:#fff;color:var(--accent);border:1px solid var(--accent)}
  .msg{padding:10px 12px;border-radius:6px;margin-top:10px;font-size:14px}
  .msg.err{background:#fbe9e2;color:var(--warn)} .msg.ok{background:#e4f2ee;color:#155c50}
  .paper{background:#fff;border:1px solid #bbb;padding:30px 34px;min-height:600px;font-family:"Malgun Gothic",sans-serif;font-size:14px}
  .banner{text-align:center;font-size:26px;font-weight:bold;letter-spacing:6px;border-bottom:3px solid #1f3f7a;padding-bottom:6px}
  .dates{display:flex;justify-content:flex-end;gap:14px;font-size:12px;margin:6px 0 12px}
  .dates b{background:#1f3f7a;color:#fff;padding:0 6px}
  .tbox{border:2px solid #1f3f7a}
  .tbox .t{font-size:21px;font-weight:bold;text-align:center;padding:10px 8px 2px}
  .tbox .s{text-align:center;font-weight:bold;padding-bottom:10px}
  .tbox .sum{border-top:1px solid #1f3f7a;padding:8px 12px;background:#f4f6fb}
  .sum div{margin:3px 0} .sum .lv2{padding-left:18px}
  .sec{display:flex;align-items:center;gap:8px;margin:16px 0 6px;font-weight:bold;font-size:16px}
  .sec .n{background:#1f3f7a;color:#fff;width:24px;text-align:center}
  .bp{margin:6px 0;text-align:justify}
  table.dt{border-collapse:collapse;width:100%;margin-top:20px;font-size:12px} table.dt td{border:1px solid #888;padding:3px 6px;text-align:center}
  .note{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>보도자료 HWPX 만들기</h1>
  <div class="sub">보도자료 내용을 넣으면 한글 문서(HWPX)로 내려받습니다. 내용은 이 PC 안에서만 다루고 어디에도 보내지 않습니다.</div>
</header>
<main>
  <section class="card">
    <div class="two">
      <div><label>보도 시점</label><input id="pub" value="2026. 11. 5.(목) 09:00"></div>
      <div><label>배포</label><input id="dist" value="2026. 11. 4.(수) 14:00"></div>
    </div>
    <label>제목</label><input id="title" placeholder="한 줄로, 무엇을 하는지 드러나게">
    <label>부제 (한 줄)</label><input id="subtitle" placeholder="예: 제주도, ○○ 사업 본격 추진">
    <label>요약 상자 (한 줄에 하나, - 로 시작하면 아래 단계)</label><textarea id="summary" rows="5"></textarea>
    <label>본문 (한 줄이 한 문단, # 으로 시작하는 줄은 번호 소제목)</label><textarea id="body" rows="12"></textarea>
    <label>참고한 기사 (언론사, 날짜, 제목)</label><input id="src" placeholder="예: ○○일보, 2026.11.3, 기사 제목">
    <label>담당 부서</label><input id="dept" placeholder="예: 제주특별자치도 ○○과">
    <div class="three">
      <div><label>책임자 직위</label><input id="r1" value="과장"></div>
      <div><label>책임자 이름 (가상)</label><input id="r2" placeholder="홍길동"></div>
      <div><label>책임자 연락처 (가상)</label><input id="r3" placeholder="064-000-0000"></div>
      <div><label>담당자 직위</label><input id="d1" value="주무관"></div>
      <div><label>담당자 이름 (가상)</label><input id="d2" placeholder="김제주"></div>
      <div><label>담당자 연락처 (가상)</label><input id="d3" placeholder="064-000-0001"></div>
    </div>
    <button id="dl">HWPX 내려받기</button>
    <button id="sample" class="light">예시 채우기 (가상)</button>
    <div id="msg"></div>
    <p class="note">교육 중에는 이름과 연락처를 가상으로 적습니다. 내려받은 파일은 한글에서 열어 확인하고, 글자 뽑기 HTML(hwpx_viewer.html)로도 다시 열어 봅니다.</p>
  </section>
  <section class="card">
    <div class="paper" id="paper"></div>
  </section>
</main>

const FIELDS=['pub','dist','title','subtitle','summary','body','src','dept','r1','r2','r3','d1','d2','d3'];

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function summaryItems(d){return lines(d.summary).map(l=>/^[-–]/.test(l)?[2,l.replace(/^[-–\s]+/,'')]:[1,l.replace(/^[▴•·\s]+/,'')]);}
function bodyItems(d){let n=0;const out=lines(d.body).map(l=>/^#/.test(l)?['sec',++n,l.replace(/^#+\s*/,'')]:['p',0,l]);if(d.src)out.push(['p',0,'※ 참고 기사: '+d.src]);return out;}
function render(){
  const d=data();
  let h='<div class="banner">보도자료</div><div class="dates"><span><b>보도시점</b> '+esc(d.pub)+'</span><span><b>배포</b> '+esc(d.dist)+'</span></div>';
  h+='<div class="tbox"><div class="t">'+esc(d.title||'제목')+'</div><div class="s">'+(d.subtitle?'- '+esc(d.subtitle)+' -':'')+'</div><div class="sum">'+summaryItems(d).map(([lv,t])=>'<div class="lv'+lv+'">'+(lv===1?'▴ ':'- ')+esc(t)+'</div>').join('')+'</div></div>';
  h+=bodyItems(d).map(([k,n,t])=>k==='sec'?'<div class="sec"><span class="n">'+n+'</span>'+esc(t)+'</div>':'<div class="bp">&nbsp;&nbsp;'+esc(t)+'</div>').join('');
  h+='<table class="dt"><tr><td rowspan="2">담당 부서</td><td rowspan="2">'+esc(d.dept)+'</td><td>책임자</td><td>'+esc(d.r1)+'</td><td>'+esc(d.r2)+'</td><td>'+esc(d.r3)+'</td></tr><tr><td>담당자</td><td>'+esc(d.d1)+'</td><td>'+esc(d.d2)+'</td><td>'+esc(d.d3)+'</td></tr></table>';
  $('paper').innerHTML=h;
}
FIELDS.forEach(k=>$(k).addEventListener('input',render));
function fill(tpl,map){return tpl.replace(/⟦(\w+)⟧/g,(m,k)=>k in map?esc(map[k]):m);}
let IDN=1000;
function ids(x){return x.replace(/⟦ID⟧/g,()=>String(++IDN));}
function sectionXml(d){
  const sum=summaryItems(d).map(([lv,t],i)=>(i?TPL.GAP:'')+fill(lv===1?TPL.LINE:TPL.SUBLINE,{T:t})).join('')||TPL.GAP;
  let out='<?xml version="1.0" encoding="UTF-8" standalone="yes" ?>'+TPL.secOpen;
  out+=TPL.P0+fill(TPL.P1,{PUB:d.pub,DIST:d.dist})+fill(TPL.P2,{TITLE:d.title,SUBTITLE:d.subtitle?'- '+d.subtitle+' -':''}).replace('⟦SUMMARY⟧',sum);
  bodyItems(d).forEach(([k,n,t])=>{ out+= k==='sec' ? TPL.BLANK+fill(TPL.SEC,{N:String(n),H:t})+TPL.BLANK : fill(TPL.BODY,{T:'  '+t})+TPL.BLANK; });
  out+=TPL.BLANK+fill(TPL.DEPT,{DEPT:d.dept,R1:d.r1,R2:d.r2,R3:d.r3,D1:d.d1,D2:d.d2,D3:d.d3});
  return ids(out)+'</hs:sec>';
}
function hpf(title){
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes" ?><opf:package xmlns:opf="http://www.idpf.org/2007/opf/" xmlns:dc="http://purl.org/dc/elements/1.1/" version="" unique-identifier="" id=""><opf:metadata><opf:title xml:space="preserve">'+esc(title)+'</opf:title><opf:language>ko</opf:language></opf:metadata><opf:manifest><opf:item id="header" href="Contents/header.xml" media-type="application/xml"/><opf:item id="section0" href="Contents/section0.xml" media-type="application/xml"/><opf:item id="settings" href="settings.xml" media-type="application/xml"/></opf:manifest><opf:spine><opf:itemref idref="header" linear="yes"/><opf:itemref idref="section0" linear="yes"/></opf:spine></opf:package>';
}
async function inflate(b64){
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  return new Uint8Array(await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
}
async function deflate(u8){
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
// ZIP 만들기. mimetype은 맨 앞에 압축하지 않고 넣어야 합니다.
async function makeZip(files){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  for(const [name,data,store] of files){
    const raw=typeof data==='string'?enc.encode(data):data, nm=enc.encode(name);
    const body=store?raw:await deflate(raw), crc=crc32(raw), method=store?0:8;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,method,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,body.length,true);lh.setUint32(22,raw.length,true);lh.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(lh.buffer),nm,body);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,method,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,body.length,true);ch.setUint32(24,raw.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),nm);
    off+=30+nm.length+body.length;
  }
  const csize=central.reduce((a,x)=>a+x.length,0), end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,csize,true);end.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:'application/hwp+zip'});
}
async function build(){
  const d=data();
  if(!d.title){ $('msg').innerHTML='<div class="msg err">제목을 먼저 적어 주세요.</div>'; return null; }
  IDN=1000;
  const prv=['보도자료',d.title,d.subtitle].concat(lines(d.summary),lines(d.body)).join('\r\n');
  return makeZip([
    ['mimetype','application/hwp+zip',true],
    ['version.xml',TPL.version],
    ['Contents/header.xml',await inflate(TPL.header)],
    ['Contents/section0.xml',sectionXml(d)],
    ['settings.xml',TPL.settings],
    ['Contents/content.hpf',hpf(d.title)],
    ['Preview/PrvText.txt',prv],
    ['META-INF/container.xml',TPL.container],
    ['META-INF/manifest.xml',TPL.manifest]
  ]);
}
$('dl').onclick=async()=>{
  try{
    const blob=await build(); if(!blob) return;
    const name=(data().title.replace(/[\\/:*?"<>|]/g,'').slice(0,30)||'보도자료')+'.hwpx';
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    $('msg').innerHTML='<div class="msg ok">'+esc(name)+' 를 내려받았습니다. 한글에서 열어 확인해 주세요.</div>';
  }catch(e){ $('msg').innerHTML='<div class="msg err">만들지 못했습니다: '+esc(e.message)+'</div>'; }
};
$('sample').onclick=()=>{
  const v={title:'제주도, 겨울철 감귤 출하 앞두고 품질 점검 나선다',subtitle:'11월 한 달간 선과장 점검반 운영',
    summary:'선과장 품질 점검반을 11월 한 달 동안 운영\n- 당도·크기 기준 준수와 비상품 감귤 혼입 여부 확인\n비상품 감귤 유통을 막아 제값 받는 유통 질서 확립',
    body:'# 점검 개요\n제주특별자치도는 본격적인 감귤 출하철을 맞아 11월 한 달 동안 선과장 품질 점검반을 운영한다고 밝혔다.\n# 주요 내용\n점검반은 당도와 크기 기준을 지키는지, 비상품 감귤이 섞여 나가지 않는지를 확인한다.\n도 관계자는 "제값을 받는 유통 질서를 함께 지켜 달라"고 당부했다.',
    src:'교육용 가상 예시',dept:'제주특별자치도 ○○과 (가상)',r2:'홍길동',r3:'064-000-0000',d2:'김제주',d3:'064-000-0001'};
  Object.entries(v).forEach(([k,x])=>$(k).value=x); render();
};
